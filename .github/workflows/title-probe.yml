name: Title probe

# Temporary experiment: what does Flash Player put in its window title for each way of
# starting the game, and can it be changed? Removed once the answer is in the launcher.

on:
  push:
    branches: [claude/flash-player-game-engine-9igo17]
    paths:
      - "tools/probe/**"
      - "lib/loaderSwf.js"
      - ".github/workflows/title-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, label: Windows }
          - { os: macos-15-intel, platform: darwin, label: macOS }
          - { os: ubuntu-22.04, platform: linux, label: Linux }
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Linux display
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick libgtk2.0-0 libnss3 libcurl4
      - name: Fetch Flash Player
        shell: bash
        run: node tools/fetch-projector.js --platform ${{ matrix.platform }}
      - name: Probe (macOS, Windows)
        if: matrix.platform != 'linux'
        shell: bash
        run: node tools/probe/title-probe.js ${{ matrix.platform }} probe-out
      - name: Probe (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a -s "-screen 0 1280x900x24" node tools/probe/title-probe.js linux probe-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.platform }}
          path: probe-out/*.png
